<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .success-box {
            text-align: center;
            padding: 60px 20px;
        }
        .success-box .icon {
            font-size: 80px;
            animation: bounce 1s ease infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .success-box h1 {
            font-size: 32px;
            color: #2ECC71;
            margin-bottom: 10px;
        }
        .success-box p {
            color: #666;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .success-box .info-box {
            background: #FFF8E1;
            border-radius: 10px;
            padding: 14px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
            color: #555;
        }
        .success-box .info-box strong {
            color: #E65100;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width:550px;margin:50px auto;">
        <div class="glass-card success-box">
            <div class="icon">🎉</div>
            <h1>Payment Successful!</h1>
            <p>Your payment has been confirmed.</p>
            <p style="color:#888;font-size:16px;">
                We'll send your access link to your email within <strong>5-10 minutes</strong>.
            </p>
            <div class="info-box">
                <strong>📌 What happens next?</strong><br>
                1️⃣ Check your email (including spam folder)<br>
                2️⃣ Click the access link you receive<br>
                3️⃣ Start learning! 📚
            </div>
            <div class="btn-group">
                <a href="/" class="btn btn-primary">🏠 Go to Home</a>
                <a href="mailto:support@learningscience.co.in" class="btn btn-secondary">📧 Contact Support</a>
            </div>
        </div>
    </div>
</body>
</html>
