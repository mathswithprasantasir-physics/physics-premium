<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Learning Notes</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* ===== ফিল্টার বার ===== */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background: var(--white);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
        }
        .filter-bar .search-box {
            flex: 1;
            min-width: 180px;
            padding: 10px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            font-size: 14px;
            transition: 0.3s;
        }
        .filter-bar .search-box:focus {
            outline: none;
            border-color: #6C63FF;
            box-shadow: 0 0 0 3px rgba(108,99,255,0.1);
        }
        .filter-bar .filter-btn {
            padding: 8px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            background: var(--white);
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: 0.3s;
            color: #333;
        }
        .filter-bar .filter-btn:hover {
            border-color: #6C63FF;
            color: #6C63FF;
        }
        .filter-bar .filter-btn.active {
            background: #6C63FF;
            color: #fff;
            border-color: #6C63FF;
        }
        .filter-bar .toggle-label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
            margin-left: 8px;
        }
        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
            background: #ccc;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: #6C63FF;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 3px;
            transition: 0.3s;
        }
        .toggle-switch.active::after {
            left: 23px;
        }
        .filter-bar .toggle-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== পোস্ট গ্রিড ===== */
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .post-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.04);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(108,99,255,0.1);
        }
        .post-card .badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
            align-self: flex-start;
        }
        .badge.physics { background: #e3f2fd; color: #0d47a1; }
        .badge.maths { background: #e8f5e9; color: #1b5e20; }
        .badge.pyq { background: #fff3e0; color: #e65100; }
        .badge.premium { background: #fce4ec; color: #c62828; }

        .post-card .emoji { font-size: 36px; margin-bottom: 6px; }
        .post-card h3 { font-size: 1.1rem; margin-bottom: 6px; color: var(--dark); }
        .post-card .desc { font-size: 0.9rem; color: #666; line-height: 1.5; flex: 1; }
        .post-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .post-card .price { font-weight: 700; color: #6C63FF; font-size: 1.1rem; }
        .post-card .price small { font-weight: 400; color: #888; font-size: 0.8rem; }
        .btn-sm {
            padding: 6px 18px;
            border-radius: 50px;
            border: none;
            background: #6C63FF;
            color: #fff;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }
        .btn-sm:hover { background: #5a52d5; transform: scale(1.02); }
        .btn-sm.outline {
            background: transparent;
            border: 2px solid #6C63FF;
            color: #6C63FF;
        }
        .btn-sm.outline:hover { background: #6C63FF; color: #fff; }

        .no-result {
            text-align: center;
            padding: 40px;
            color: #888;
            grid-column: 1 / -1;
        }

        /* ===== প্যাকেজ কার্ড ===== */
        .package-banner {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 30px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .package-banner .info h3 { font-size: 1.3rem; }
        .package-banner .info p { opacity: 0.8; font-size: 0.95rem; }
        .package-banner .btn { background: #6C63FF; color: #fff; padding: 10px 28px; border-radius: 50px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .package-banner .btn:hover { background: #5a52d5; transform: scale(1.02); }

        @media (max-width: 600px) {
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .toggle-group { justify-content: center; }
            .package-banner { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Dark Mode Toggle -->
        <div style="display:flex;justify-content:flex-end;padding:10px 0;">
            <button onclick="toggleDarkMode()" style="background:none;border:none;font-size:24px;cursor:pointer;">🌓</button>
        </div>

        <!-- Hero Section -->
        <section class="hero">
            <h1>📚 <span class="highlight">Premium Learning Notes</span></h1>
            <p>Complete notes, PYQs, and study materials for <strong>Maths & Science</strong></p>
            <div class="badges">
                <span>✅ 100+ Chapters</span>
                <span>✅ ₹1 Only</span>
                <span>✅ PYQs Included</span>
            </div>
        </section>

        <!-- ===== ফিল্টার বার ===== -->
        <div class="filter-bar">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 Search posts..." onkeyup="applyFilters()">
            
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">📚 All</button>
            <button class="filter-btn" data-filter="physics" onclick="setFilter('physics')">⚛️ Physics</button>
            <button class="filter-btn" data-filter="maths" onclick="setFilter('maths')">📐 Maths</button>
            <button class="filter-btn" data-filter="pyq" onclick="setFilter('pyq')">📝 PYQs</button>

            <div class="toggle-group">
                <span class="toggle-label">📦 Package</span>
                <div class="toggle-switch active" id="packageToggle" onclick="toggleMode()"></div>
                <span class="toggle-label" id="modeLabel">Single</span>
            </div>
        </div>

        <!-- ===== প্যাকেজ ব্যানার (শুধু প্যাকেজ মোডে) ===== -->
        <div class="package-banner" id="packageBanner">
            <div class="info">
                <h3>🌟 All Access Pass</h3>
                <p>Get all Physics + Maths + PYQs in one package</p>
            </div>
            <a href="/register.html" class="btn">🔓 Get All Access — ₹79</a>
        </div>

        <!-- ===== পোস্ট গ্রিড ===== -->
        <div class="post-grid" id="postGrid">
            <!-- পোস্টগুলো JavaScript দিয়ে লোড হবে -->
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        // =============================================
        // পোস্ট ডেটা
        // =============================================
        const POSTS = [
            { id: 'magnetic-effects', title: 'Magnetic Effects of Current', category: 'physics', emoji: '🧲', desc: 'Complete chapter with formulas, derivations, and practice questions.', price: '₹1', badge: 'Premium' },
            { id: 'thermodynamics', title: 'Thermodynamics', category: 'physics', emoji: '🔥', desc: 'Laws of thermodynamics, heat engines, and entropy explained.', price: '₹1', badge: 'Premium' },
            { id: 'optics', title: 'Ray Optics', category: 'physics', emoji: '🔦', desc: 'Reflection, refraction, lenses, and optical instruments.', price: '₹1', badge: 'Premium' },
            { id: 'electrostatics', title: 'Electrostatics', category: 'physics', emoji: '⚡', desc: 'Electric charges, fields, potential, and capacitance.', price: '₹1', badge: 'Premium' },
            { id: 'calculus', title: 'Calculus - Complete Guide', category: 'maths', emoji: '📐', desc: 'Differentiation, integration, and applications with solved examples.', price: '₹1', badge: 'Premium' },
            { id: 'algebra', title: 'Algebra Masterclass', category: 'maths', emoji: '📊', desc: 'Linear algebra, matrices, and complex numbers made easy.', price: '₹1', badge: 'Premium' },
            { id: 'trigonometry', title: 'Trigonometry Guide', category: 'maths', emoji: '📏', desc: 'Angles, identities, and equations with step-by-step solutions.', price: '₹1', badge: 'Premium' },
            { id: 'pyqs-physics', title: 'PYQs - Class 12 Physics', category: 'pyq', emoji: '📝', desc: 'Previous 10 years questions with detailed solutions.', price: '₹1', badge: 'PYQs' },
            { id: 'pyqs-maths', title: 'PYQs - Class 12 Maths', category: 'pyq', emoji: '📝', desc: 'Previous 10 years questions with detailed solutions.', price: '₹1', badge: 'PYQs' }
        ];

        // =============================================
        // স্টেট
        // =============================================
        let currentFilter = 'all';
        let isPackageMode = true; // true = package mode, false = single mode

        // =============================================
        // ফিল্টার ফাংশন
        // =============================================
        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('postGrid');
            
            let filtered = POSTS.filter(post => {
                // ক্যাটাগরি ফিল্টার
                if (currentFilter !== 'all' && post.category !== currentFilter) return false;
                // সার্চ ফিল্টার
                if (search && !post.title.toLowerCase().includes(search) && !post.desc.toLowerCase().includes(search)) return false;
                return true;
            });

            // প্যাকেজ মোডে শুধু ক্যাটাগরি অনুযায়ী দেখান
            if (isPackageMode) {
                // প্যাকেজ মোডে সব পোস্ট দেখানো হবে, কিন্তু "Get All Access" ব্যানার দেখাবে
                // আলাদা কোনো ফিল্টার লাগে না
            }

            renderPosts(filtered);
        }

        // =============================================
        // পোস্ট রেন্ডার
        // =============================================
        function renderPosts(posts) {
            const grid = document.getElementById('postGrid');
            if (posts.length === 0) {
                grid.innerHTML = `<div class="no-result">😕 No posts found. Try a different search.</div>`;
                return;
            }

            grid.innerHTML = posts.map(post => {
                const badgeClass = post.category === 'physics' ? 'physics' : 
                                   post.category === 'maths' ? 'maths' : 'pyq';
                const btnLink = isPackageMode ? '/register.html' : `/register.html?post=${post.id}`;
                const btnText = isPackageMode ? '🔓 Get Access' : '🔓 Buy ₹1';

                return `
                    <div class="post-card">
                        <span class="badge ${badgeClass}">${post.badge}</span>
                        <span class="emoji">${post.emoji}</span>
                        <h3>${post.title}</h3>
                        <p class="desc">${post.desc}</p>
                        <div class="footer">
                            <span class="price">${post.price} <small>/-</small></span>
                            <a href="${btnLink}" class="btn-sm">${btnText}</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // =============================================
        // ফিল্টার সেট
        // =============================================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            applyFilters();
        }

        // =============================================
        // মোড টগল (প্যাকেজ / সিঙ্গেল)
        // =============================================
        function toggleMode() {
            isPackageMode = !isPackageMode;
            const toggle = document.getElementById('packageToggle');
            const label = document.getElementById('modeLabel');
            const banner = document.getElementById('packageBanner');

            toggle.classList.toggle('active', isPackageMode);
            label.textContent = isPackageMode ? 'Package' : 'Single';

            // প্যাকেজ ব্যানার দেখান/লুকান
            banner.style.display = isPackageMode ? 'flex' : 'none';

            // সিঙ্গেল মোডে প্রতিটি পোস্টের জন্য আলাদা বাটন
            applyFilters();
        }

        // =============================================
        // ডার্ক মোড টগল (স্টাইল.css-এর সাথে কাজ করে)
        // =============================================
        function toggleDarkMode() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        // =============================================
        // থিম লোড
        // =============================================
        (function loadTheme() {
            const saved = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        // =============================================
        // শুরু করুন
        // =============================================
        document.addEventListener('DOMContentLoaded', () => {
            // প্যাকেজ মোড ডিফল্ট
            document.getElementById('packageToggle').classList.add('active');
            document.getElementById('modeLabel').textContent = 'Package';
            document.getElementById('packageBanner').style.display = 'flex';
            applyFilters();
        });
    </script>
</body>
</html>
