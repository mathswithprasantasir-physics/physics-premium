<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:var(--light-gray);">
    <div class="container" style="max-width:420px;">
        <div class="glass-card" style="text-align:center;">
            <div style="font-size:64px;">🔐</div>
            <h1 style="font-size:28px;margin-top:12px;">Admin Login</h1>
            <p style="color:var(--gray);margin-bottom:28px;">Enter your password to access the dashboard</p>

            <form id="loginForm">
                <div class="form-group" style="text-align:left;">
                    <label>📧 Email</label>
                    <input type="email" id="adminEmail" value="admin@learningscience.co.in" readonly style="background:var(--light-gray);color:var(--gray);">
                </div>
                <div class="form-group" style="text-align:left;">
                    <label>🔑 Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">🔓 Login</button>
                <div id="errorMsg" style="color:var(--danger);font-size:14px;margin-top:12px;display:none;">❌ Invalid password. Please try again.</div>
            </form>

            <p style="color:var(--gray);font-size:13px;margin-top:20px;">🔒 Secure Admin Access</p>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <!-- admin-login.html - JavaScript আপডেট -->
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        const errorMsg = document.getElementById('errorMsg');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success && data.user.isAdmin) {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminToken', data.token);
                localStorage.setItem('adminLoginTime', new Date().toISOString());
                Toast.show('✅ Login successful!', 'success');
                window.location.href = '/admin.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = '❌ Invalid admin credentials';
            }
        } catch (error) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = '❌ Server error. Please try again.';
        }
    });
</script>
</body>
</html>
