<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
        .login-box{max-width:400px;width:100%;background:#fff;padding:40px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.1);text-align:center;}
        .login-box h1{color:#1a1a2e;font-size:28px;margin-bottom:10px;}
        .login-box .subtitle{color:#666;font-size:14px;margin-bottom:30px;}
        .form-group{margin-bottom:20px;text-align:left;}
        label{display:block;font-weight:600;color:#333;margin-bottom:6px;}
        input{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;}
        input:focus{outline:none;border-color:#1a73e8;}
        .btn{width:100%;padding:14px;background:#1a73e8;color:#fff;border:none;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;transition:0.3s;}
        .btn:hover{background:#1557b0;}
        .error{color:#e53935;font-size:14px;margin-top:10px;display:none;}
        .footer{color:#888;font-size:13px;margin-top:20px;}
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 Admin Login</h1>
        <p class="subtitle">Enter your password to access the dashboard</p>
        
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="adminEmail" value="admin@learningscience.co.in" readonly style="background:#f5f5f5;color:#888;">
            </div>
            <div class="form-group">
                <label>🔑 Password</label>
                <input type="password" id="adminPassword" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">🔓 Login</button>
            <div id="errorMsg" class="error">❌ Invalid password. Please try again.</div>
        </form>
        
        <p class="footer">🔒 Secure Admin Access</p>
    </div>

    <script>
        // ===== আপনার পাসওয়ার্ড সেট করুন =====
        const ADMIN_PASSWORD = 'admin123';  // ← এই পাসওয়ার্ডটি পরিবর্তন করুন
        
        function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (password === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminLoginTime', new Date().toISOString());
                window.location.href = '/admin.html';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('adminPassword').value = '';
                document.getElementById('adminPassword').focus();
            }
            return false;
        }
    </script>
</body>
</html>
