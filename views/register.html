<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Physics Premium</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width: 420px; margin: 50px auto;">
        <div class="card">
            <h1 style="text-align: center;">📝 Register</h1>
            <form id="registerForm">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" required placeholder="student@example.com">
                </div>
                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="fullName" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>📱 Phone</label>
                    <input type="text" id="phone" placeholder="Phone Number">
                </div>
                <div class="form-group">
                    <label>🔑 Password</label>
                    <input type="password" id="password" required placeholder="Min 6 characters">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">🚀 Register</button>
                <div id="errorMsg" style="color: #e53935; margin-top: 10px; display: none;"></div>
                <div id="successMsg" style="color: #2e7d32; margin-top: 10px; display: none;"></div>
            </form>
            <p style="text-align: center; margin-top: 16px;">
                Already have an account? <a href="/login">Login</a>
            </p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const submitBtn = this.querySelector('button');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.textContent = '⏳ Registering...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, fullName, phone })
                });

                const data = await response.json();

                if (data.success) {
                    successMsg.textContent = '✅ Registration successful! Redirecting to login...';
                    successMsg.style.display = 'block';
                    setTimeout(() => window.location.href = '/login', 2000);
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Registration failed');
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = '❌ Server error. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.textContent = '🚀 Register';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
