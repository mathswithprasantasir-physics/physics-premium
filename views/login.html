<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width:420px;margin:50px auto;">
        <div class="card">
            <h1 style="text-align:center;">🔐 Login</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" required placeholder="student@example.com">
                </div>
                <div class="form-group">
                    <label>🔑 Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">🚀 Login</button>
                <div id="errorMsg" style="color:#e53935;margin-top:10px;display:none;"></div>
            </form>
            <p style="text-align:center;margin-top:16px;">Don't have an account? <a href="/register.html">Register</a></p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const submitBtn = this.querySelector('button');

            errorMsg.style.display = 'none';
            submitBtn.textContent = '⏳ Logging in...';
            submitBtn.disabled = true;

            try {
                // ✅ সঠিক URL: api/auth/login
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userEmail', data.user.email);
                    window.location.href = '/dashboard/';
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Invalid email or password');
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = '❌ Server error. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.textContent = '🚀 Login';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
