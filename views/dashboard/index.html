<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Physics Premium</title>
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>📚 Premium</h2>
            </div>
            <div class="sidebar-sub">Physics &amp; Maths Notes</div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="active">
                    <span>📊</span> Dashboard
                </a>
                <a href="/dashboard/my-purchases">
                    <span>📥</span> My Purchases
                </a>
                <a href="/dashboard/profile">
                    <span>👤</span> Profile
                </a>
                <a href="#" onclick="logout()">
                    <span>🚪</span> Logout
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="dashboard-header">
                <h1>Welcome, <span id="userName">Student</span>!</h1>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-icon">📚</span>
                    <div class="stat-info">
                        <h3>Purchases</h3>
                        <p id="totalPurchases">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">📄</span>
                    <div class="stat-info">
                        <h3>Downloads</h3>
                        <p id="totalDownloads">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">💰</span>
                    <div class="stat-info">
                        <h3>Total Spent</h3>
                        <p id="totalSpent">₹0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon">🔑</span>
                    <div class="stat-info">
                        <h3>Active Tokens</h3>
                        <p id="activeTokens">0</p>
                    </div>
                </div>
            </div>

            <section class="recent-section">
                <h2>Recent Purchases</h2>
                <div id="recentPurchases">
                    <p class="empty">No purchases yet. <a href="/browse">Browse notes →</a></p>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
