<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .dashboard-layout {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: #1a1a2e;
            color: #fff;
            padding: 30px 20px;
            min-height: 100vh;
        }
        .sidebar a {
            display: block;
            color: #a0aec0;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 4px;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(108,99,255,0.2);
            color: #fff;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            background: #f5f7fa;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .stat-card h3 { font-size: 14px; color: #888; margin-bottom: 4px; }
        .stat-card p { font-size: 28px; font-weight: 700; }
        .purchase-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .empty { color: #888; text-align: center; padding: 30px 0; }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h2 style="color:#6C63FF;">📚 Premium</h2>
            <nav>
                <a href="/dashboard/" class="active">📊 Dashboard</a>
                <a href="/dashboard/my-purchases.html">📥 My Purchases</a>
                <a href="/dashboard/profile.html">👤 Profile</a>
                <a href="#" onclick="logout()">🚪 Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <h1>Welcome, <span id="userName">Student</span>!</h1>

            <div class="stats-grid">
                <div class="stat-card"><h3>📚 Purchases</h3><p id="totalPurchases">0</p></div>
                <div class="stat-card"><h3>📄 Downloads</h3><p id="totalDownloads">0</p></div>
                <div class="stat-card"><h3>💰 Spent</h3><p id="totalSpent">₹0</p></div>
            </div>

            <section style="background:#fff;border-radius:12px;padding:20px;">
                <h2>Recent Purchases</h2>
                <div id="recentPurchases"><p class="empty">No purchases yet.</p></div>
            </section>
        </main>
    </div>

    <script>
        // ===== সেশন চেক =====
        async function checkAuth() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                window.location.href = '/login.html?redirect=/dashboard/';
                return false;
            }
            try {
                const response = await fetch('/api/auth/verify-session', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (!data.valid) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login.html?redirect=/dashboard/';
                    return false;
                }
                return data.user;
            } catch {
                return false;
            }
        }

        // ===== ড্যাশবোর্ড লোড =====
        async function loadDashboard() {
            const user = await checkAuth();
            if (!user) return;

            document.getElementById('userName').textContent = user.fullName || 'Student';

            try {
                const token = localStorage.getItem('authToken');
                const response = await fetch('/api/dashboard/index', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                document.getElementById('totalPurchases').textContent = data.totalPurchases || 0;
                document.getElementById('totalDownloads').textContent = data.totalDownloads || 0;
                document.getElementById('totalSpent').textContent = `₹${data.totalSpent || 0}`;

                const list = document.getElementById('recentPurchases');
                if (data.recentPurchases && data.recentPurchases.length > 0) {
                    list.innerHTML = data.recentPurchases.map(p => `
                        <div class="purchase-item">
                            <span>${p.postTitle}</span>
                            <span>₹${p.amount} • ${new Date(p.purchasedAt).toLocaleDateString()}</span>
                        </div>
                    `).join('');
                }
            } catch (error) {
                console.error('Dashboard error:', error);
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = '/login.html';
        }

        document.addEventListener('DOMContentLoaded', loadDashboard);
    </script>
</body>
</html>
