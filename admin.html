<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Batch Token Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width:900px;margin:40px auto;">
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--light-gray);border-radius:12px;margin-bottom:24px;flex-wrap:wrap;gap:10px;">
            <div>
                <span style="font-weight:600;">👋 Welcome, Admin!</span>
                <span style="font-size:13px;color:var(--gray);margin-left:10px;">Logged in: <span id="loginTimeDisplay"></span></span>
            </div>
            <button onclick="handleLogout()" class="btn btn-danger" style="padding:8px 24px;font-size:14px;">🚪 Logout</button>
        </div>

        <h1 style="font-size:28px;margin-bottom:24px;">🔑 Batch Token Generator</h1>

        <!-- Single Token -->
        <div class="glass-card" style="margin-bottom:24px;">
            <h2 style="font-size:18px;margin-bottom:16px;">📌 Single Token</h2>
            <div style="display:flex;gap:16px;flex-wrap:wrap;">
                <div style="flex:1;min-width:200px;">
                    <label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px;">Email</label>
                    <input type="email" id="singleEmail" placeholder="student@example.com" style="width:100%;padding:12px 16px;border:2px solid #E5E7EB;border-radius:12px;">
                </div>
                <div style="flex:1;min-width:150px;">
                    <label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px;">Post</label>
                    <select id="postSelect" style="width:100%;padding:12px 16px;border:2px solid #E5E7EB;border-radius:12px;">
                        <option value="magnetic-effects">Magnetic Effects</option>
                        <option value="electrostatics">Electrostatics</option>
                        <option value="optics">Ray Optics</option>
                    </select>
                </div>
            </div>
            <button onclick="generateSingle()" class="btn btn-primary" style="margin-top:12px;">🔓 Generate Single Token</button>
        </div>

        <!-- Bulk Token -->
        <div class="glass-card" style="margin-bottom:24px;">
            <h2 style="font-size:18px;margin-bottom:16px;">📦 Batch Tokens</h2>
            <label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px;">Enter Emails (one per line)</label>
            <textarea id="bulkEmails" placeholder="student1@gmail.com&#10;student2@gmail.com&#10;student3@gmail.com" style="width:100%;padding:12px 16px;border:2px solid #E5E7EB;border-radius:12px;min-height:120px;"></textarea>
            <div style="margin-top:12px;">
                <label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px;">Validity (days)</label>
                <input type="number" id="validityDays" value="365" min="1" max="3650" style="width:100%;padding:12px 16px;border:2px solid #E5E7EB;border-radius:12px;">
            </div>
            <button onclick="generateBulk()" class="btn btn-secondary" style="margin-top:12px;">📦 Generate Bulk Tokens</button>
        </div>

        <!-- Result -->
        <div id="result" class="glass-card" style="display:none;border-left:4px solid var(--success);">
            <h3 style="color:var(--success);margin-bottom:12px;">✅ Tokens Generated!</h3>
            <div id="resultContent"></div>
            <button onclick="copyResult()" class="btn btn-primary" style="padding:8px 20px;font-size:14px;">📋 Copy All</button>
            <button onclick="downloadCSV()" class="btn btn-secondary" style="padding:8px 20px;font-size:14px;margin-left:10px;">📥 Download CSV</button>
        </div>

        <!-- User List -->
        <div class="glass-card" style="margin-top:24px;">
            <h2 style="font-size:18px;margin-bottom:16px;">📊 User List</h2>
            <div id="userList" style="max-height:400px;overflow-y:auto;">
                <p style="color:var(--gray);">No users yet. Generate tokens to see them here.</p>
            </div>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        // ===== AUTH CHECK =====
        if (!checkAuth()) { /* redirect handled in checkAuth */ }

        // ===== LOGOUT =====
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminLoggedIn');
                localStorage.removeItem('adminLoginTime');
                window.location.href = '/admin-login.html';
            }
        }

        // ===== LOGIN TIME =====
        document.addEventListener('DOMContentLoaded', () => {
            const time = localStorage.getItem('adminLoginTime');
            if (time) {
                document.getElementById('loginTimeDisplay').textContent = new Date(time).toLocaleString('en-IN');
            }
        });

        // ===== AUTO LOGOUT (15 min) =====
        let inactivityTimer;
        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                Toast.show('Session expired due to inactivity.', 'warning');
                handleLogout();
            }, 15 * 60 * 1000);
        }
        ['click', 'keypress', 'scroll', 'mousemove'].forEach(event => {
            document.addEventListener(event, resetInactivityTimer);
        });
        resetInactivityTimer();

        // ===== DATA =====
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        let lastResult = [];

        // ===== GENERATE TOKEN =====
        function generateTokenForUser(email, postId) {
            const encodedEmail = btoa(email);
            const random = Math.random().toString(36).substring(2, 10);
            const timestamp = Date.now().toString(36);
            const token = 'prem_' + timestamp + '_' + encodedEmail + '_' + random;
            const now = new Date();
            const days = parseInt(document.getElementById('validityDays').value) || 365;
            const expiry = new Date(now);
            expiry.setDate(expiry.getDate() + days);
            return {
                email, postId, token,
                createdAt: now.toISOString(),
                expiresAt: expiry.toISOString(),
                isActive: true,
                link: `https://physics-premium.vercel.app/posts/2026/08/${postId}.html?token=${token}`
            };
        }

        // ===== GENERATE SINGLE =====
        function generateSingle() {
            const email = document.getElementById('singleEmail').value.trim();
            const postId = document.getElementById('postSelect').value;
            if (!email || !isValidEmail(email)) {
                Toast.show('Please enter a valid email.', 'error');
                return;
            }
            const result = generateTokenForUser(email, postId);
            showResult([result]);
            saveUser(result);
            Toast.show('✅ Token generated successfully!', 'success');
        }

        // ===== GENERATE BULK =====
        function generateBulk() {
            const emails = document.getElementById('bulkEmails').value.split('\n')
                .map(e => e.trim())
                .filter(e => e && isValidEmail(e));
            if (emails.length === 0) {
                Toast.show('Please enter at least one valid email.', 'error');
                return;
            }
            const postId = document.getElementById('postSelect').value;
            const results = emails.map(email => generateTokenForUser(email, postId));
            showResult(results);
            results.forEach(user => saveUser(user));
            Toast.show(`✅ ${results.length} tokens generated!`, 'success');
        }

        // ===== SHOW RESULT =====
        function showResult(results) {
            lastResult = results;
            const container = document.getElementById('result');
            const content = document.getElementById('resultContent');
            let html = `<div style="max-height:300px;overflow-y:auto;background:var(--white);padding:12px;border-radius:12px;">`;
            results.forEach((user, i) => {
                html += `<div style="display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #eee;font-size:13px;">
                    <span style="font-weight:500;">${i+1}. ${user.email}</span>
                    <span style="font-family:monospace;color:var(--secondary);font-size:12px;word-break:break-all;">${user.token}</span>
                </div>`;
            });
            html += `</div>`;
            html += `<div style="margin-top:12px;font-size:14px;color:var(--gray);">
                <strong>Total:</strong> ${results.length} tokens generated.<br>
                <strong>Validity:</strong> ${document.getElementById('validityDays').value} days.
                <br><strong>🔒 Security:</strong> Email is encrypted in token.
            </div>`;
            content.innerHTML = html;
            container.style.display = 'block';
            renderUserList();
        }

        // ===== SAVE USER =====
        function saveUser(user) {
            const existing = users.findIndex(u => u.email === user.email && u.postId === user.postId);
            if (existing >= 0) users[existing] = user;
            else users.push(user);
            localStorage.setItem('users', JSON.stringify(users));
        }

        // ===== RENDER USER LIST =====
        function renderUserList() {
            const container = document.getElementById('userList');
            if (users.length === 0) {
                container.innerHTML = '<p style="color:var(--gray);">No users yet.</p>';
                return;
            }
            const sorted = [...users].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            let html = `<table style="width:100%;border-collapse:collapse;font-size:13px;">
                <tr style="background:var(--light-gray);">
                    <th style="padding:10px;text-align:left;">Email</th>
                    <th style="padding:10px;text-align:left;">Token</th>
                    <th style="padding:10px;text-align:left;">Expires</th>
                    <th style="padding:10px;text-align:center;">Status</th>
                </tr>`;
            sorted.slice(0, 50).forEach(user => {
                const isExpired = new Date(user.expiresAt) < new Date();
                const status = isExpired ? 
                    '<span style="background:#FCE4EC;color:#C62828;padding:3px 12px;border-radius:50px;font-size:12px;">Expired</span>' : 
                    '<span style="background:#E8F5E9;color:#2E7D32;padding:3px 12px;border-radius:50px;font-size:12px;">Active</span>';
                html += `<tr>
                    <td style="padding:10px;">${user.email}</td>
                    <td style="padding:10px;font-family:monospace;font-size:11px;word-break:break-all;">${user.token.substring(0, 30)}...</td>
                    <td style="padding:10px;">${new Date(user.expiresAt).toLocaleDateString('en-IN')}</td>
                    <td style="padding:10px;text-align:center;">${status}</td>
                </tr>`;
            });
            if (sorted.length > 50) {
                html += `<tr><td colspan="4" style="padding:10px;text-align:center;color:var(--gray);">... and ${sorted.length - 50} more users</td></tr>`;
            }
            html += '</table>';
            html += `<div style="margin-top:12px;font-size:13px;color:var(--gray);">Total: ${sorted.length} users</div>`;
            container.innerHTML = html;
        }

        // ===== COPY =====
        function copyResult() {
            let text = '';
            lastResult.forEach(user => text += `${user.email} → ${user.link}\n`);
            copyToClipboard(text);
        }

        // ===== DOWNLOAD CSV =====
        function downloadCSV() {
            let csv = 'Email,Post,Token,Link,Created,Expires\n';
            lastResult.forEach(user => {
                csv += `${user.email},${user.postId},${user.token},${user.link},${user.createdAt},${user.expiresAt}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tokens_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        document.addEventListener('DOMContentLoaded', renderUserList);
    </script>
</body>
</html>
