<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #6C63FF;
        }
        .stat-card .label {
            font-size: 13px;
            color: #888;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 12px;
        }
        .badge-warning {
            background: #fff3e0;
            color: #e65100;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 12px;
        }
        .btn-sm {
            padding: 4px 12px;
            border-radius: 50px;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-sm.primary {
            background: #6C63FF;
            color: #fff;
        }
        .btn-sm.primary:hover {
            background: #5a52d5;
        }
        .btn-sm.copy {
            background: #1a1a2e;
            color: #fff;
        }
        .btn-sm.copy:hover {
            background: #333;
        }
        .token-text {
            font-family: monospace;
            font-size: 11px;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width:1100px;margin:30px auto;">
        <!-- Header -->
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#f8f9fa;border-radius:12px;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
            <div>
                <span style="font-weight:600;">👋 Admin Dashboard</span>
                <span style="font-size:13px;color:#888;margin-left:10px;">Logged in: <span id="loginTimeDisplay"></span></span>
            </div>
            <button onclick="handleLogout()" style="background:#e53935;color:#fff;padding:8px 24px;border:none;border-radius:50px;cursor:pointer;">🚪 Logout</button>
        </div>

        <h1>📊 Dashboard</h1>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalUsers">0</div>
                <div class="label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalRevenue">₹0</div>
                <div class="label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="number" id="todayUsers">0</div>
                <div class="label">Today's Users</div>
            </div>
        </div>

        <!-- User List -->
        <div class="glass-card">
            <h2 style="font-size:18px;margin-bottom:12px;">📋 Recent Users</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Package</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Token</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="7" style="text-align:center;color:#888;">No users yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ===== লগইন চেক =====
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = '/admin-login.html';
        }

        function handleLogout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminLoginTime');
            window.location.href = '/admin-login.html';
        }

        document.getElementById('loginTimeDisplay').textContent = 
            new Date(localStorage.getItem('adminLoginTime')).toLocaleString('en-IN');

        // ===== ইউজার ডেটা লোড =====
        async function loadUsers() {
            try {
                const response = await fetch('/api/get-users');
                const data = await response.json();
                
                if (data.users && data.users.length > 0) {
                    updateStats(data.users);
                    renderTable(data.users);
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function updateStats(users) {
            document.getElementById('totalUsers').textContent = users.length;
            
            const totalRevenue = users.reduce((sum, u) => sum + (u.amount || 0), 0);
            document.getElementById('totalRevenue').textContent = `₹${totalRevenue}`;
            
            const today = new Date().toDateString();
            const todayUsers = users.filter(u => new Date(u.createdAt).toDateString() === today);
            document.getElementById('todayUsers').textContent = todayUsers.length;
        }

        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#888;">No users yet</td></tr>';
                return;
            }
            
            tbody.innerHTML = users.slice(0, 20).map(user => {
                const isActive = new Date(user.expiresAt) > new Date();
                const shortToken = user.token ? user.token.substring(0, 20) + '...' : 'N/A';
                const fullLink = `https://physics-premium.vercel.app/posts/2026/08/magnetic-effects.html?token=${user.token}`;
                
                return `
                    <tr>
                        <td style="font-size:12px;">${user.email}</td>
                        <td>${user.package || 'Unknown'}</td>
                        <td>₹${user.amount || 0}</td>
                        <td>${new Date(user.createdAt).toLocaleDateString('en-IN')}</td>
                        <td>
                            <span class="token-text" title="${fullLink}">${shortToken}</span>
                        </td>
                        <td>
                            <span class="${isActive ? 'badge-success' : 'badge-warning'}">
                                ${isActive ? '✅ Active' : '⏰ Expired'}
                            </span>
                        </td>
                        <td>
                            <button class="btn-sm copy" onclick="copyLink('${user.token}')">📋 Copy</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // ===== লিংক কপি =====
        function copyLink(token) {
            const link = `https://physics-premium.vercel.app/posts/2026/08/magnetic-effects.html?token=${token}`;
            
            navigator.clipboard.writeText(link).then(() => {
                alert('✅ Link copied to clipboard!\n\nPaste it to send to user.');
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = link;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                textarea.remove();
                alert('✅ Link copied to clipboard!\n\nPaste it to send to user.');
            });
        }

        // ===== পেজ লোড হলে =====
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
