<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--white);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #6C63FF;
        }
        .stat-card .label {
            font-size: 13px;
            color: #888;
        }
        .table-wrap {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        th {
            background: #f8f9fa;
            font-weight: 600;
        }
        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 12px;
        }
        .badge-warning {
            background: #fff3e0;
            color: #e65100;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 12px;
        }
        .btn-sm {
            padding: 4px 12px;
            border-radius: 50px;
            border: none;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-sm.primary {
            background: #6C63FF;
            color: #fff;
        }
        .btn-sm.primary:hover {
            background: #5a52d5;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width:1000px;margin:30px auto;">
        <div class="header-bar" style="display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#f8f9fa;border-radius:12px;margin-bottom:20px;">
            <div>
                <span style="font-weight:600;">👋 Admin Dashboard</span>
                <span style="font-size:13px;color:#888;margin-left:10px;">Logged in: <span id="loginTimeDisplay"></span></span>
            </div>
            <button onclick="handleLogout()" style="background:#e53935;color:#fff;padding:8px 24px;border:none;border-radius:50px;cursor:pointer;">🚪 Logout</button>
        </div>

        <h1>📊 Dashboard</h1>

        <!-- Stats -->
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <div class="number" id="totalUsers">0</div>
                <div class="label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="number" id="totalRevenue">₹0</div>
                <div class="label">Total Revenue</div>
            </div>
            <div class="stat-card">
                <div class="number" id="todayUsers">0</div>
                <div class="label">Today's Users</div>
            </div>
        </div>

        <!-- User List -->
        <div class="glass-card">
            <h2 style="font-size:18px;margin-bottom:12px;">📋 Recent Users</h2>
            <div class="table-wrap">
                <table id="userTable">
                    <thead>
                        <tr>
                            <th>Email</th>
                            <th>Package</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="6" style="text-align:center;color:#888;">No users yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ===== লগইন চেক =====
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = '/admin-login.html';
        }

        function handleLogout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminLoginTime');
            window.location.href = '/admin-login.html';
        }

        document.getElementById('loginTimeDisplay').textContent = 
            new Date(localStorage.getItem('adminLoginTime')).toLocaleString('en-IN');

        // ===== ইউজার ডেটা লোড =====
        async function loadUsers() {
            try {
                const response = await fetch('/api/get-users');
                const data = await response.json();
                
                if (data.users && data.users.length > 0) {
                    updateStats(data.users);
                    renderTable(data.users);
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function updateStats(users) {
            document.getElementById('totalUsers').textContent = users.length;
            
            const totalRevenue = users.reduce((sum, u) => sum + (u.amount || 0), 0);
            document.getElementById('totalRevenue').textContent = `₹${totalRevenue}`;
            
            const today = new Date().toDateString();
            const todayUsers = users.filter(u => new Date(u.createdAt).toDateString() === today);
            document.getElementById('todayUsers').textContent = todayUsers.length;
        }

        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;">No users yet</td></tr>';
                return;
            }
            
            tbody.innerHTML = users.slice(0, 20).map(user => `
                <tr>
                    <td>${user.email}</td>
                    <td>${user.package || 'Unknown'}</td>
                    <td>₹${user.amount || 0}</td>
                    <td>${new Date(user.createdAt).toLocaleDateString('en-IN')}</td>
                    <td>
                        <span class="${user.isActive ? 'badge-success' : 'badge-warning'}">
                            ${user.isActive ? 'Active' : 'Expired'}
                        </span>
                    </td>
                    <td>
                        <button class="btn-sm primary" onclick="resendLink('${user.email}')">📧 Resend</button>
                    </td>
                </tr>
            `).join('');
        }

        async function resendLink(email) {
            if (!confirm(`Send new access link to ${email}?`)) return;
            
            try {
                const response = await fetch('/api/send-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, packageName: 'Premium Notes' })
                });
                const data = await response.json();
                if (data.success) {
                    alert('✅ New access link sent to email!');
                } else {
                    alert('❌ Failed to send link.');
                }
            } catch (error) {
                alert('❌ Something went wrong.');
            }
        }

        loadUsers();
    </script>
</body>
</html>
