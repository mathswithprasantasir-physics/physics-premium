<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:Arial,sans-serif;background:#f0f2f5;padding:30px;}
        .container{max-width:600px;margin:0 auto;background:#fff;padding:30px;border-radius:16px;}
        h1{color:#1a1a2e;margin-bottom:20px;}
        label{display:block;font-weight:bold;margin:10px 0 5px;}
        input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:8px;font-size:16px;margin-bottom:15px;}
        button{background:#43a047;color:#fff;padding:14px;border:none;border-radius:50px;font-size:18px;font-weight:bold;cursor:pointer;width:100%;transition:0.3s;}
        button:hover{background:#2e7d32;}
        .result{background:#e8f5e9;padding:20px;border-radius:12px;margin-top:20px;display:none;}
        .result .link{background:#fff;padding:12px;border-radius:8px;word-break:break-all;margin:10px 0;}
        .result .link a{color:#e53935;}
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Generate Access Link</h1>
        
        <label>Select Post</label>
        <select id="postSelect">
            <option value="magnetic-effects">Magnetic Effects (₹1)</option>
            <option value="electrostatics">Electrostatics (₹1)</option>
        </select>
        
        <label>User Email</label>
        <input type="email" id="userEmail" placeholder="student@example.com">
        
        <button onclick="generateLink()">🔓 Generate Link</button>
        
        <div id="result" class="result">
            <h3 style="color:#2e7d32;">✅ Link Generated!</h3>
            <p><strong>Post:</strong> <span id="resultPost"></span></p>
            <p><strong>User:</strong> <span id="resultEmail"></span></p>
            <div class="link">
                <strong>🔗 Link:</strong><br>
                <a href="#" id="resultLink" target="_blank"></a>
            </div>
            <button onclick="copyLink()" style="background:#1a1a2e;padding:10px;font-size:14px;">📋 Copy Link</button>
        </div>
    </div>

    <script>
        function generateLink() {
            const postId = document.getElementById('postSelect').value;
            const email = document.getElementById('userEmail').value;
            
            if(!email) {
                alert('Please enter email');
                return;
            }
            
            // Generate token
            const token = 'magnetic-token-2026'; // Use unique token per post
            
            // Create link
            const link = `https://your-vercel-app.vercel.app/posts/2026/08/magnetic-effects.html?token=${token}`;
            
            // Show result
            document.getElementById('result').style.display = 'block';
            document.getElementById('resultPost').textContent = postId;
            document.getElementById('resultEmail').textContent = email;
            document.getElementById('resultLink').href = link;
            document.getElementById('resultLink').textContent = link;
        }
        
        function copyLink() {
            const link = document.getElementById('resultLink').href;
            navigator.clipboard.writeText(link).then(() => alert('Link copied!'));
        }
    </script>
</body>
</html>
