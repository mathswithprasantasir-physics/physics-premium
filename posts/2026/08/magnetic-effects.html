<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Effects of Current</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 30px auto; background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
        
        h1 { text-align: center; color: #1a1a2e; font-size: 2.2rem; margin-bottom: 30px; border-bottom: 2px solid #6C63FF; padding-bottom: 15px; }
        h2 { color: #0d3b4f; border-left: 5px solid #43a047; padding-left: 15px; margin-top: 30px; }
        
        .note-box { background: #fff8e1; border-left: 5px solid #ff8f00; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .question-block { background: #fafcfe; padding: 18px; border: 1px solid #e4eaef; border-radius: 8px; margin: 15px 0; }
        
        table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: #f3f3f3; font-weight: 600; }
        
        .math { text-align: center; padding: 15px; font-size: 20px; font-weight: 600; color: #1a1a2e; background: #f0eeff; border-radius: 8px; margin: 15px 0; }
        
        .access-denied { text-align: center; padding: 80px 20px; }
        .access-denied h1 { color: #e53935; border-bottom: none; }
        .access-denied p { font-size: 18px; color: #666; margin-bottom: 15px; }
        .access-denied .btn { background: #1a1a2e; color: #fff; padding: 14px 50px; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 16px; display: inline-block; transition: 0.3s; }
        .access-denied .btn:hover { background: #6C63FF; transform: scale(1.05); }
        .access-denied .error-detail { background: #fff3e0; padding: 15px; border-radius: 8px; margin: 20px auto; max-width: 500px; text-align: left; }
        .access-denied .error-detail li { margin: 8px 0; color: #555; }

        @media (max-width: 600px) {
            .container { padding: 20px; margin: 10px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container" id="contentContainer">
        <div id="loadingMessage" style="text-align:center;padding:50px;color:#888;font-size:18px;">⏳ Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('contentContainer');

        // =============================================
        // ১. ইউজারের ইমেইল চেক করুন
        // =============================================
        let userEmail = urlParams.get('email') || localStorage.getItem('userEmail');

        // যদি ইমেইল না থাকে, তাহলে ইউজারকে ইনপুট দিতে বলুন
        if (!userEmail) {
            userEmail = prompt('Please enter your registered email address to access this content:');
            if (userEmail && userEmail.trim() !== '') {
                localStorage.setItem('userEmail', userEmail.trim());
                userEmail = userEmail.trim();
            }
        }

        // =============================================
        // ২. Token Verify করুন
        // =============================================
        async function verifyToken() {
            if (!token) {
                showDenied('No access token found in the URL.');
                return;
            }

            // Test Token (শুধু ডেভেলপমেন্টের জন্য)
            if (token === 'test-token-2026') {
                showContent();
                return;
            }

            // যদি ইমেইল না থাকে
            if (!userEmail) {
                showDenied('Email is required to access this content. Please refresh and enter your email.');
                return;
            }

            try {
                // লোডিং দেখান
                document.getElementById('loadingMessage').innerHTML = '⏳ Verifying your access...';

                const response = await fetch('/api/verify-token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token: token,
                        email: userEmail
                    })
                });

                const data = await response.json();

                if (data.valid) {
                    showContent();
                } else {
                    showDenied(data.error || 'Invalid token or email mismatch.');
                }
            } catch (error) {
                console.error('Verification error:', error);
                showDenied('Unable to verify access. Please check your internet connection.');
            }
        }

        // =============================================
        // ৩. Content Show করুন
        // =============================================
        function showContent() {
            container.innerHTML = `
                <div style="background:#e8f5e9;padding:10px 16px;border-radius:8px;margin-bottom:20px;text-align:center;border:1px solid #a5d6a7;">
                    ✅ <strong>Access Granted</strong> — Welcome <span style="color:#2e7d32;">${userEmail || 'User'}</span>
                </div>
                <h1>🧲 Magnetic Effects of Current</h1>
                
                <h2>1. Concept of Magnetic Field</h2>
                <p>In 1820, Hans Christian Oersted discovered that a compass needle deflects when placed near a current-carrying wire.</p>
                
                <div class="note-box">
                    <strong>Memory Trick (SNOW Rule):</strong> South to North Over Wire → West
                </div>

                <h2>2. Biot-Savart Law</h2>
                <div class="math">dB = (μ₀/4π) × (I dl sinθ) / r²</div>
                
                <div class="question-block">
                    <p><strong>Concept Check:</strong> If current is doubled and radius is halved, what happens to B?</p>
                    <details><summary>View Answer</summary><p>Becomes 4 times larger!</p></details>
                </div>

                <h2>3. Ampere's Circuital Law</h2>
                <div class="math">∮ B·dl = μ₀I<sub>enclosed</sub></div>

                <h2>4. Lorentz Force</h2>
                <div class="math">F = qE + q(v × B)</div>

                <h2>5. Motion in Perpendicular B</h2>
                <div class="math">r = mv/qB</div>
                <div class="math">ν = qB/2πm</div>

                <h2>6. Force on Current-Carrying Conductor</h2>
                <div class="math">F = ILB sinθ</div>

                <h2>7. Force Between Parallel Wires</h2>
                <div class="math">F/L = μ₀I₁I₂/2πd</div>
                
                <div class="note-box">
                    <strong>Definition of 1 Ampere:</strong> Force of 2×10⁻⁷ N/m between two parallel wires 1m apart.
                </div>

                <h2>8. Torque on a Loop</h2>
                <div class="math">τ = NIAB sinθ</div>

                <h2>9. Moving Coil Galvanometer</h2>
                <div class="math">I = (k/NAB)α</div>

                <h2>10. Conversion of Galvanometer</h2>
                <table>
                    <tr><th>Device</th><th>Method</th><th>Formula</th></tr>
                    <tr><td>Ammeter</td><td>Shunt (S) in parallel</td><td>S = I<sub>g</sub>G/(I - I<sub>g</sub>)</td></tr>
                    <tr><td>Voltmeter</td><td>High resistance (R) in series</td><td>R = V/I<sub>g</sub> - G</td></tr>
                </table>

                <div style="background:#e3f2fd;padding:15px;border-radius:8px;margin-top:30px;text-align:center;border:1px solid #90caf9;">
                    <p style="margin:0;color:#0d47a1;">🔒 This content is exclusively for <strong>${userEmail || 'registered users'}</strong></p>
                </div>

                <p style="text-align:center;margin-top:40px;color:#888;font-size:14px;">© 2026 Learning Science. All rights reserved.</p>
            `;
        }

        // =============================================
        // ৪. Access Denied Show করুন
        // =============================================
        function showDenied(errorMessage = '') {
            container.innerHTML = `
                <div class="access-denied">
                    <h1>⛔ Access Denied</h1>
                    <p>${errorMessage || 'This link is not valid for this device/browser.'}</p>
                    
                    <div class="error-detail">
                        <p style="font-weight:600;margin-top:0;color:#e65100;">📌 Why this happened?</p>
                        <ul style="list-style:none;padding:0;">
                            <li>• You may be trying to access from a different email address.</li>
                            <li>• This link is tied to the email used for payment.</li>
                            <li>• Please use the same email address you used during purchase.</li>
                            ${userEmail ? `<li>• Your current email: <strong>${userEmail}</strong></li>` : ''}
                        </ul>
                    </div>
                    
                    <p style="font-size:14px;color:#888;margin-top:20px;">
                        <strong>Need help?</strong> Contact us at <a href="mailto:support@learningscience.in">support@learningscience.in</a>
                    </p>
                    
                    <a href="/" class="btn" style="margin-top:10px;">← Go back to Home</a>
                    <br>
                    <a href="#" onclick="location.reload()" style="display:inline-block;margin-top:15px;color:#6C63FF;text-decoration:underline;cursor:pointer;">⟳ Try again with different email</a>
                </div>
            `;
        }

        // =============================================
        // ৫. পেজ লোড হওয়ার সময় Verify করুন
        // =============================================
        document.addEventListener('DOMContentLoaded', verifyToken);
    </script>
</body>
</html>
