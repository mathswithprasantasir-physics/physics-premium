<!DOCTYPE html>
<html>
<head>
    <title>Magnetic Effects of Current</title>
    <style>
        body{font-family:Arial;background:#f5f7fa;padding:20px;}
        .container{max-width:900px;margin:0 auto;background:#fff;padding:30px;border-radius:16px;}
        h1{text-align:center;color:#1a1a2e;}
        h2{color:#0d3b4f;border-left:4px solid #43a047;padding-left:12px;}
        .note-box{background:#fff8e1;border-left:4px solid #ff8f00;padding:12px;border-radius:6px;}
        .question-block{background:#fafcfe;padding:14px;border:1px solid #e4eaef;border-radius:8px;}
        table{width:100%;border-collapse:collapse;}
        th,td{border:1px solid #ddd;padding:10px;text-align:center;}
        th{background:#f3f3f3;}
        .math{text-align:center;padding:10px;font-size:18px;}
        .access-denied{text-align:center;padding:80px;}
        .access-denied h1{color:#e53935;}
        .access-denied .btn{background:#1a1a2e;color:#fff;padding:12px 40px;border-radius:50px;text-decoration:none;}
    </style>
</head>
<body>
    <div class="container" id="contentContainer">
        <div id="loadingMessage" style="text-align:center;padding:50px;color:#888;">⏳ Loading...</div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const container = document.getElementById('contentContainer');

        function extractEmailFromToken(token) {
            if (!token || !token.startsWith('prem_')) return null;
            try {
                const parts = token.split('_');
                if (parts.length >= 3) {
                    return atob(parts[2]);
                }
            } catch (e) { return null; }
            return null;
        }

        function getUserEmail() {
            return localStorage.getItem('userEmail') || urlParams.get('email') || null;
        }

        function isTokenValid(token) {
            if (!token) return false;
            if (token === 'test-token-2026') return true;
            if (!token.startsWith('prem_')) return false;
            const tokenEmail = extractEmailFromToken(token);
            if (!tokenEmail) return false;
            const userEmail = getUserEmail();
            if (!userEmail) return false;
            return tokenEmail.toLowerCase() === userEmail.toLowerCase();
        }

        if (isTokenValid(token)) {
            container.innerHTML = `
                <h1>🧲 Magnetic Effects of Current</h1>
                
                <h2>1. Concept of Magnetic Field</h2>
                <p>In 1820, Hans Christian Oersted discovered that a compass needle deflects when placed near a current-carrying wire.</p>
                
                <div class="note-box">
                    <strong>Memory Trick (SNOW Rule):</strong> South to North Over Wire → West
                </div>

                <h2>2. Biot-Savart Law</h2>
                <div class="math">dB = (μ₀/4π) × (I dl sinθ) / r²</div>
                
                <div class="question-block">
                    <p><strong>Concept Check:</strong> If current is doubled and radius is halved, what happens to B?</p>
                    <details><summary>View Answer</summary><p>Becomes 4 times larger!</p></details>
                </div>

                <h2>3. Ampere's Circuital Law</h2>
                <div class="math">∮ B·dl = μ₀I<sub>enclosed</sub></div>

                <h2>4. Lorentz Force</h2>
                <div class="math">F = qE + q(v × B)</div>

                <h2>5. Motion in Perpendicular B</h2>
                <div class="math">r = mv/qB</div>
                <div class="math">ν = qB/2πm</div>

                <h2>6. Force on Current-Carrying Conductor</h2>
                <div class="math">F = ILB sinθ</div>

                <h2>7. Force Between Parallel Wires</h2>
                <div class="math">F/L = μ₀I₁I₂/2πd</div>
                
                <div class="note-box">
                    <strong>Definition of 1 Ampere:</strong> Force of 2×10⁻⁷ N/m between two parallel wires 1m apart.
                </div>

                <h2>8. Torque on a Loop</h2>
                <div class="math">τ = NIAB sinθ</div>

                <h2>9. Moving Coil Galvanometer</h2>
                <div class="math">I = (k/NAB)α</div>

                <h2>10. Conversion of Galvanometer</h2>
                <table>
                    <tr><th>Device</th><th>Method</th><th>Formula</th></tr>
                    <tr><td>Ammeter</td><td>Shunt (S) in parallel</td><td>S = I<sub>g</sub>G/(I - I<sub>g</sub>)</td></tr>
                    <tr><td>Voltmeter</td><td>High resistance (R) in series</td><td>R = V/I<sub>g</sub> - G</td></tr>
                </table>

                <p style="text-align:center;margin-top:40px;color:#888;">© 2026 Learning Science</p>
            `;
        } else {
            container.innerHTML = `
                <div class="access-denied">
                    <h1>⛔ Access Denied</h1>
                    <p>You need to purchase this content.</p>
                    <a href="/" class="btn">← Go back</a>
                </div>
            `;
        }
    </script>
</body>
</html>
