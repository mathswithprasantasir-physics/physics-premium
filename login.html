<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Premium Learning Notes</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .login-container { max-width: 420px; margin: 50px auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #6C63FF; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #6C63FF; color: #fff; }
        .btn-primary:hover { background: #5a52d5; }
        .error-msg { color: #e53935; font-size: 14px; margin-top: 10px; display: none; }
        .success-msg { color: #2e7d32; font-size: 14px; margin-top: 10px; display: none; }
        .register-link { text-align: center; margin-top: 16px; font-size: 14px; color: #666; }
        .register-link a { color: #6C63FF; text-decoration: none; font-weight: 600; }
        .register-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container login-container">
        <div class="glass-card">
            <div style="text-align:center;font-size:48px;">🔐</div>
            <h1 style="text-align:center;font-size:28px;margin-top:10px;">Welcome Back</h1>
            <p style="text-align:center;color:#888;margin-bottom:24px;">Login to access your premium content</p>

            <form id="loginForm">
                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="email" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label>🔑 Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary">🚀 Login</button>

                <div id="errorMsg" class="error-msg">❌ Invalid email or password</div>
                <div id="successMsg" class="success-msg">✅ Login successful! Redirecting...</div>
            </form>

            <div class="register-link">
                Don't have an account? <a href="/register.html">Register here</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            const submitBtn = this.querySelector('button[type="submit"]');

            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            submitBtn.textContent = '⏳ Logging in...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userEmail', data.user.email);
                    localStorage.setItem('userName', data.user.fullName || '');
                    localStorage.setItem('isAdmin', data.user.isAdmin || false);

                    successMsg.style.display = 'block';
                    
                    // Redirect after 1 second
                    setTimeout(() => {
                        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
                        window.location.href = redirect;
                    }, 1000);
                } else {
                    errorMsg.textContent = '❌ ' + (data.error || 'Invalid email or password');
                    errorMsg.style.display = 'block';
                }

            } catch (error) {
                errorMsg.textContent = '❌ Server error. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.textContent = '🚀 Login';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
