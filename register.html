<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Get Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="max-width:520px;margin:40px auto;">
        <div class="glass-card">
            <div style="text-align:center;">
                <div style="font-size:48px;">📚</div>
                <h1 style="font-size:28px;margin-top:10px;">Get <span class="gradient-text">Access</span></h1>
                <p style="color:var(--gray);margin-bottom:24px;">Enter your email to get started</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="userEmail" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label>📖 Select Post</label>
                    <select id="postSelect">
                        <option value="magnetic-effects">Magnetic Effects of Current</option>
                        <option value="electrostatics">Electrostatics</option>
                        <option value="optics">Ray Optics</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">
                    🚀 Continue to Payment
                </button>
            </form>

            <p style="text-align:center;font-size:13px;color:var(--gray);margin-top:16px;">
                🔒 Your email will be used to verify your access link
            </p>
        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const postId = document.getElementById('postSelect').value;

            if (!isValidEmail(email)) {
                Toast.show('Please enter a valid email address.', 'error');
                return;
            }

            setUserData(email, postId);
            window.location.href = `/checkout.html?post=${postId}&email=${encodeURIComponent(email)}`;
        });
    </script>
</body>
</html>
