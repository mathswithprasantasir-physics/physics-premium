<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Get Access</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#f5f7fa,#c3cfe2);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
        .container{max-width:450px;width:100%;background:#fff;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.1);}
        h1{color:#1a1a2e;font-size:28px;text-align:center;}
        .subtitle{text-align:center;color:#666;margin:10px 0 25px;}
        .form-group{margin-bottom:20px;}
        label{display:block;font-weight:600;color:#333;margin-bottom:6px;}
        input,select{width:100%;padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;}
        input:focus,select:focus{outline:none;border-color:#1a73e8;}
        .btn{width:100%;padding:14px;background:#43a047;color:#fff;border:none;border-radius:50px;font-size:18px;font-weight:600;cursor:pointer;transition:0.3s;}
        .btn:hover{background:#2e7d32;}
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Get Access</h1>
        <p class="subtitle">Enter your email to get started</p>
        <form id="registerForm">
            <div class="form-group">
                <label>📧 Email Address</label>
                <input type="email" id="userEmail" placeholder="student@example.com" required>
            </div>
            <div class="form-group">
                <label>📖 Select Post</label>
                <select id="postSelect">
                    <option value="magnetic-effects">Magnetic Effects of Current (₹1)</option>
                    <option value="electrostatics">Electrostatics (₹1)</option>
                    <option value="optics">Ray Optics (₹1)</option>
                </select>
            </div>
            <button type="submit" class="btn">🚀 Continue to Payment</button>
        </form>
    </div>
    <script>
        document.getElementById('registerForm').onsubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('userEmail').value.trim();
            const postId = document.getElementById('postSelect').value;
            if (!email || !email.includes('@')) { alert('Please enter a valid email.'); return; }
            localStorage.setItem('userEmail', email);
            localStorage.setItem('postId', postId);
            window.location.href = `/checkout.html?post=${postId}&email=${encodeURIComponent(email)}`;
        };
    </script>
</body>
</html>
